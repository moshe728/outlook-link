<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Opening Outlook</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:-apple-system,Segoe UI,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#f6f7f9;color:#1f2937}
.c{text-align:center}a{display:inline-block;margin-top:14px;padding:10px 18px;background:#0f6cbd;color:#fff;border-radius:8px;text-decoration:none}</style></head>
<body><div class="c"><div id="t">Opening Outlook...</div><a id="a" href="#">Open in Outlook</a></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var kind = q.get('k') === 'event' ? 'events/open/event/' : 'emails/open/message/';
  var id = q.get('id') || 'AAkALgAAAAAAHYQDEapmEc2byACqAC-EWg0AuiFfH8F6z02ptNWazA3eMQAIG4UAsQAA';
  var acct = q.get('a') || '3394284934';
  if (!/^[A-Za-z0-9_=-]+$/.test(id) || !/^\d+$/.test(acct)) { document.getElementById('t').textContent = 'Invalid link'; document.getElementById('a').hidden = true; return; }
  var url = 'ms-outlook://' + kind + '?account=' + acct + '&immutableID=' + encodeURIComponent(id);
  document.getElementById('a').href = url;
  location.href = url;
  setTimeout(function () { try { window.close(); } catch (e) {} }, 2500);
})();
</script></body></html>
